version: '3.8'

services:
  # FastAPI Application
  api:
    build: .
    container_name: setu-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://setu_user:setu_password@db:5432/setu_patients
      - DEBUG=True
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - setu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: setu-db
    environment:
      - POSTGRES_USER=setu_user
      - POSTGRES_PASSWORD=setu_password
      - POSTGRES_DB=setu_patients
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create_tables.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - setu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: setu-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - setu-network

volumes:
  postgres_data:

networks:
  setu-network:
    driver: bridge
